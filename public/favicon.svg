<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan to Purple Neon Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cap Crown (Futuristic Dome) -->
  <path d="M 50,15 C 26,15 16,35 16,62 C 35,66 65,66 84,62 C 84,35 74,15 50,15 Z" fill="url(#cyber-grad)" opacity="0.12" stroke="url(#cyber-grad)" stroke-width="2.5" />
  
  <!-- Cyberpunk Panel lines / details on crown -->
  <path d="M 50,15 L 50,44" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 32,25 C 40,32 40,42 50,44" fill="none" stroke="#7f00ff" stroke-width="2" opacity="0.7" />
  <path d="M 68,25 C 60,32 60,42 50,44" fill="none" stroke="#7f00ff" stroke-width="2" opacity="0.7" />
  
  <!-- Glowing Hexagon Crest / Logo on center panel -->
  <polygon points="50,29 58,34 58,44 50,49 42,44 42,34" fill="#00f0ff" filter="url(#glow)" opacity="0.85" />
  <polygon points="50,32 55,35 55,43 50,46 45,43 45,35" fill="#0a0a0c" />
  <circle cx="50" cy="39" r="2" fill="#ff007f" filter="url(#glow)" />

  <!-- Visor / Brim (Futuristic glowing curves) -->
  <path d="M 12,61 C 30,74 70,74 88,61 C 94,65 91,72 81,77 C 65,83 35,83 19,77 C 9,72 6,65 12,61 Z" fill="url(#cyber-grad)" filter="url(#glow)" />
  <path d="M 15,62 C 32,73 68,73 85,62" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Sleek under-visor shadow -->
  <path d="M 21,66 C 35,75 65,75 79,66" fill="none" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
</svg>
